<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Assessment platform illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141127"/>
      <stop offset="1" stop-color="#08070f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#g)"/>
  <ellipse cx="400" cy="250" rx="330" ry="230" fill="url(#halo)"/>

  <!-- browser window -->
  <g>
    <rect x="86" y="96" width="628" height="330" rx="20" fill="#0b0a14" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="86" y="96" width="628" height="46" rx="20" fill="#11101d"/>
    <rect x="86" y="128" width="628" height="14" fill="#11101d"/>
    <circle cx="114" cy="119" r="5" fill="#ff5f57" opacity="0.75"/>
    <circle cx="132" cy="119" r="5" fill="#febc2e" opacity="0.75"/>
    <circle cx="150" cy="119" r="5" fill="#28c840" opacity="0.75"/>
    <rect x="196" y="111" width="196" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="566" y="109" width="128" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.45"/>

    <!-- live proctoring badge -->
    <g>
      <rect x="110" y="166" width="112" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="128" cy="180" r="4" fill="#34d399"/>
      <text x="142" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="1.6" fill="#9ff0cd">LIVE</text>
    </g>

    <!-- waveform -->
    <g fill="url(#bar)">
      <rect x="120" y="288" width="10" height="34" rx="5" opacity="0.55"/>
      <rect x="142" y="270" width="10" height="70" rx="5" opacity="0.7"/>
      <rect x="164" y="248" width="10" height="114" rx="5" opacity="0.85"/>
      <rect x="186" y="276" width="10" height="58" rx="5" opacity="0.65"/>
      <rect x="208" y="232" width="10" height="146" rx="5"/>
      <rect x="230" y="266" width="10" height="78" rx="5" opacity="0.72"/>
      <rect x="252" y="292" width="10" height="26" rx="5" opacity="0.5"/>
      <rect x="274" y="252" width="10" height="106" rx="5" opacity="0.8"/>
      <rect x="296" y="280" width="10" height="50" rx="5" opacity="0.6"/>
      <rect x="318" y="240" width="10" height="130" rx="5" opacity="0.9"/>
      <rect x="340" y="296" width="10" height="18" rx="5" opacity="0.45"/>
      <rect x="362" y="268" width="10" height="74" rx="5" opacity="0.7"/>
      <rect x="384" y="286" width="10" height="38" rx="5" opacity="0.55"/>
    </g>
    <line x1="120" y1="372" x2="410" y2="372" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- code panel -->
    <g>
      <rect x="446" y="212" width="236" height="164" rx="14" fill="#0e0d1a" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="466" y="234" width="72" height="8" rx="4" fill="#8b5cf6" fill-opacity="0.85"/>
      <rect x="466" y="254" width="148" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="486" y="274" width="118" height="8" rx="4" fill="#22d3ee" fill-opacity="0.6"/>
      <rect x="486" y="294" width="92" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="466" y="314" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="486" y="334" width="64" height="8" rx="4" fill="#34d399" fill-opacity="0.55"/>
      <rect x="466" y="352" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    </g>
  </g>

  <!-- shield badge -->
  <g transform="translate(636 78)">
    <circle r="34" fill="#0f0d1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <path d="M0 -16 12 -11v9c0 8-6 13-12 16-6-3-12-8-12-16v-9Z" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.6"/>
    <path d="m-6 0 4 4 8-9" fill="none" stroke="#9feaf5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="86" y="470" font-family="Sora, Inter, sans-serif" font-size="14" letter-spacing="3.4" fill="#8b87a3">DJANGO · DRF · JUDGE0</text>
  <text x="714" y="470" text-anchor="end" font-family="Sora, Inter, sans-serif" font-size="14" letter-spacing="3.4" fill="#8b87a3">01 / PROCTORING</text>
</svg>
