<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Background task queue illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1428"/>
      <stop offset="1" stop-color="#08070f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#g)"/>
  <ellipse cx="400" cy="260" rx="330" ry="220" fill="url(#halo)"/>

  <!-- connections -->
  <g stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M232 172h96" stroke-dasharray="6 8"/>
    <path d="M232 262h96"/>
    <path d="M232 352h96" stroke-dasharray="6 8"/>
    <path d="M432 262h84" stroke-dasharray="6 8"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="286" cy="172" r="3.4"/>
    <circle cx="286" cy="262" r="3.4"/>
    <circle cx="286" cy="352" r="3.4"/>
    <circle cx="474" cy="262" r="3.4"/>
  </g>

  <!-- queue nodes -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="1.4">
    <g>
      <rect x="96" y="146" width="136" height="52" rx="14" fill="#0c0b18" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="112" y="162" width="18" height="18" rx="5" fill="#8b5cf6" fill-opacity="0.55"/>
      <text x="142" y="176" fill="#cfcae9">ML inference</text>
    </g>
    <g>
      <rect x="96" y="236" width="136" height="52" rx="14" fill="#0c0b18" stroke="#8b5cf6" stroke-opacity="0.55"/>
      <rect x="112" y="252" width="18" height="18" rx="5" fill="#22d3ee" fill-opacity="0.55"/>
      <text x="142" y="266" fill="#e6e2f8">Report job</text>
    </g>
    <g>
      <rect x="96" y="326" width="136" height="52" rx="14" fill="#0c0b18" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="112" y="342" width="18" height="18" rx="5" fill="#34d399" fill-opacity="0.5"/>
      <text x="142" y="356" fill="#cfcae9">Events</text>
    </g>
  </g>

  <!-- broker hub -->
  <g>
    <rect x="328" y="196" width="104" height="132" rx="26" fill="url(#node)" stroke="#22d3ee" stroke-opacity="0.4"/>
    <g fill="none" stroke="#a7f3d4" stroke-width="1.8" stroke-linecap="round">
      <path d="M356 244h48"/>
      <path d="M356 262h32"/>
      <path d="M356 280h40"/>
    </g>
    <text x="380" y="216" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="1.8" fill="#9feaf5">REDIS</text>
  </g>

  <!-- worker -->
  <g>
    <rect x="516" y="190" width="188" height="144" rx="20" fill="#0b0a14" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(578 262)">
      <circle r="34" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <circle r="11" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="4 5"/>
      <g stroke="#c4b5fd" stroke-width="4" stroke-linecap="round">
        <path d="M0-20v-6"/>
        <path d="M0 20v6"/>
        <path d="M-20 0h-6"/>
        <path d="M20 0h6"/>
        <path d="m-14-14-5-5"/>
        <path d="m14 14 5 5"/>
        <path d="m14-14 5-5"/>
        <path d="m-14 14-5 5"/>
      </g>
    </g>
    <text x="610" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="1.4" fill="#a9a5c0">Celery</text>
    <text x="610" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="1.2" fill="#726e8b">workers</text>
    <g fill="#22d3ee">
      <circle cx="544" cy="216" r="3.4"/>
      <circle cx="558" cy="216" r="3.4" opacity="0.6"/>
      <circle cx="572" cy="216" r="3.4" opacity="0.3"/>
    </g>
  </g>

  <!-- fastapi chip -->
  <g>
    <rect x="516" y="98" width="132" height="40" rx="20" fill="#0c0b18" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="582" y="123" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="1.8" fill="#9feaf5">FASTAPI</text>
  </g>

  <text x="96" y="452" font-family="Sora, Inter, sans-serif" font-size="14" letter-spacing="3.4" fill="#8b87a3">ASYNC · FAULT TOLERANT</text>
  <text x="704" y="452" text-anchor="end" font-family="Sora, Inter, sans-serif" font-size="14" letter-spacing="3.4" fill="#8b87a3">02 / QUEUES</text>
</svg>
